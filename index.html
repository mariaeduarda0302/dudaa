<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Agro - Agricultura e Pecuária</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🌱 AgroQuiz</div>
        <p>Agricultura • Pecuária • Conhecimento</p>
    </header>

    <main>
        <section class="quiz-container">

            <div class="progresso">
                <span id="numeroPergunta">Pergunta 1</span>
                <div class="barra">
                    <div id="barraProgresso"></div>
                </div>
            </div>

            <div class="icone" id="icone">🌾</div>

            <h1 id="pergunta">
                Qual é uma das principais funções do solo na agricultura?
            </h1>

            <div id="respostas" class="respostas">
                <button onclick="responder(0)">Produzir eletricidade</button>
                <button onclick="responder(1)">Fornecer nutrientes para as plantas</button>
                <button onclick="responder(2)">Produzir combustível</button>
                <button onclick="responder(3)">Criar máquinas agrícolas</button>
            </div>

            <div id="resultado" class="resultado"></div>

            <button id="proxima" class="proxima" onclick="proximaPergunta()">
                Próxima pergunta →
            </button>

        </section>
    </main>

    <footer>
        <p>🌿 AgroQuiz — Aprendendo sobre o campo de forma divertida</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
